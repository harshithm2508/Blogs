<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog Library</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #e4e4e0;
    --accent: #2f5bd3; --accent-soft: #e8eefc; --chip: #f0f0ec;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141416; --panel: #1d1d20; --text: #ececee; --muted: #9a9aa2; --line: #2e2e33;
            --accent: #8aa8ff; --accent-soft: #23293b; --chip: #26262b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { padding: 28px 16px 8px; max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -0.01em; }
  .stats { color: var(--muted); font-size: 14px; }
  .stats b { color: var(--text); }
  .controls { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); }
  .controls-inner { max-width: 1100px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px; }
  input, select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
                  border-radius: 8px; padding: 7px 10px; min-width: 0; }
  input[type=search] { flex: 1 1 220px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { font: inherit; border: 0; background: var(--panel); color: var(--muted); padding: 7px 12px; cursor: pointer; }
  .seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  main { max-width: 1100px; margin: 0 auto; padding: 8px 16px 60px; }
  .group { margin-top: 26px; }
  .group h2 { font-size: 17px; margin: 0 0 10px; display: flex; align-items: baseline; gap: 8px; }
  .group h2 .n { color: var(--muted); font-weight: 400; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
          display: flex; flex-direction: column; gap: 6px; cursor: pointer; transition: border-color .15s; }
  .card:hover { border-color: var(--accent); }
  .card h3 { margin: 0; font-size: 15.5px; line-height: 1.35; }
  .meta { color: var(--muted); font-size: 13px; }
  .desc { font-size: 13.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2;
          -webkit-box-orient: vertical; overflow: hidden; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 1px 8px; font-size: 12px; color: var(--muted); }
  .chip.status { background: var(--accent-soft); color: var(--accent); }
  .empty { color: var(--muted); text-align: center; padding: 60px 0; }
  dialog { width: min(820px, 100%); max-height: 92vh; border: 1px solid var(--line); border-radius: 14px; padding: 0;
           background: var(--panel); color: var(--text); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .reader-head { position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--line);
                 padding: 10px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
  .reader-head button { font: inherit; background: var(--chip); color: var(--text); border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .reader { padding: 8px 24px 32px; overflow-wrap: anywhere; }
  .reader img { max-width: 100%; height: auto; border-radius: 6px; }
  .reader pre { background: var(--chip); padding: 12px; border-radius: 8px; overflow-x: auto; }
  .reader code { font-size: 13px; }
  .reader blockquote { margin: 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
  .reader table { border-collapse: collapse; display: block; overflow-x: auto; }
  .reader td, .reader th { border: 1px solid var(--line); padding: 4px 8px; }
</style>
</head>
<body>
<header>
  <h1>📚 Blog Library</h1>
  <div class="stats" id="stats">Loading…</div>
</header>
<div class="controls"><div class="controls-inner">
  <input type="search" id="q" placeholder="Search title, author, tag…" aria-label="Search">
  <div class="seg" role="group" aria-label="Group by">
    <button data-g="company" class="on">Company</button><button data-g="source">Source</button><button data-g="none">All</button>
  </div>
  <select id="company" aria-label="Company"><option value="">All companies</option></select>
  <select id="source" aria-label="Source"><option value="">All sources</option></select>
  <select id="status" aria-label="Status"><option value="">Any status</option><option value="read">Read</option><option value="to-read">To read</option></select>
</div></div>
<main id="main"></main>

<dialog id="dlg">
  <div class="reader-head">
    <span class="meta" id="dlg-meta"></span>
    <span><a id="dlg-orig" target="_blank" rel="noopener">Original ↗</a> &nbsp; <button id="dlg-close">Close</button></span>
  </div>
  <article class="reader" id="dlg-body"></article>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let blogs = [], group = "company";

function remember(k, v) { try { localStorage.setItem("blogs." + k, v); } catch {} }
function recall(k) { try { return localStorage.getItem("blogs." + k); } catch { return null; } }

function fillSelect(id, values) {
  const sel = $(id);
  [...new Set(values)].sort((a, b) => a.localeCompare(b)).forEach((v) => sel.add(new Option(v, v)));
}

function card(b) {
  const tags = (b.tags || []).slice(0, 4).map((t) => `<span class="chip">${esc(t)}</span>`).join("");
  const stars = b.rating ? " · " + "★".repeat(b.rating) : "";
  return `<div class="card" data-id="${esc(b.id)}" tabindex="0">
    <h3>${esc(b.title)}</h3>
    <div class="meta">${esc([b.author, b.publication].filter(Boolean).join(" · "))}</div>
    <div class="meta">${esc(b.published || "undated")} · ${b.reading_minutes || "?"} min${stars}</div>
    ${b.description ? `<div class="desc">${esc(b.description)}</div>` : ""}
    <div class="chips"><span class="chip status">${b.status === "read" ? "✓ read" : "to read"}</span>
      <span class="chip">${esc(group === "source" ? b.company : b.source)}</span>${tags}</div>
  </div>`;
}

function render() {
  const q = $("#q").value.trim().toLowerCase();
  const fc = $("#company").value, fs = $("#source").value, st = $("#status").value;
  const rows = blogs.filter((b) =>
    (!fc || b.company === fc) && (!fs || b.source === fs) && (!st || b.status === st) &&
    (!q || [b.title, b.author, b.publication, b.company, b.source, b.description, ...(b.tags || [])]
            .join(" ").toLowerCase().includes(q)));
  if (!rows.length) { $("#main").innerHTML = `<div class="empty">${blogs.length ? "No posts match." : "No posts tracked yet."}</div>`; return; }
  const groups = new Map();
  for (const b of rows) {
    const k = group === "none" ? "All posts" : b[group];
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(b);
  }
  const ordered = [...groups].sort((a, b) => (a[0] === "Independent") - (b[0] === "Independent") || b[1].length - a[1].length || a[0].localeCompare(b[0]));
  $("#main").innerHTML = ordered.map(([k, items]) =>
    `<section class="group"><h2>${esc(k)} <span class="n">${items.length}</span></h2><div class="grid">${items.map(card).join("")}</div></section>`).join("");
}

async function openPost(id) {
  const b = blogs.find((x) => x.id === id);
  if (!b) return;
  $("#dlg-meta").textContent = [b.company, b.source].join(" · ");
  $("#dlg-orig").href = b.url;
  $("#dlg-body").innerHTML = "<p class='meta'>Loading…</p>";
  $("#dlg").showModal();
  try {
    const res = await fetch(b.path);
    if (!res.ok) throw new Error(res.status);
    const md = (await res.text()).replace(/^---\n[\s\S]*?\n---\n/, "");
    $("#dlg-body").innerHTML = DOMPurify.sanitize(marked.parse(md));
    $("#dlg-body").querySelectorAll("a").forEach((a) => { a.target = "_blank"; a.rel = "noopener"; });
  } catch (e) {
    $("#dlg-body").innerHTML = `<p>Couldn't load the saved copy. <a href="${esc(b.url)}" target="_blank" rel="noopener">Open the original</a>.</p>`;
  }
}

document.querySelectorAll(".seg button").forEach((btn) => btn.addEventListener("click", () => {
  group = btn.dataset.g; remember("group", group);
  document.querySelectorAll(".seg button").forEach((x) => x.classList.toggle("on", x === btn));
  render();
}));
["#q", "#company", "#source", "#status"].forEach((s) => $(s).addEventListener("input", render));
$("#main").addEventListener("click", (e) => { const c = e.target.closest(".card"); if (c) openPost(c.dataset.id); });
$("#main").addEventListener("keydown", (e) => { const c = e.target.closest(".card"); if (c && e.key === "Enter") openPost(c.dataset.id); });
$("#dlg-close").addEventListener("click", () => $("#dlg").close());
$("#dlg").addEventListener("click", (e) => { if (e.target === $("#dlg")) $("#dlg").close(); });

fetch("data/blogs.json", { cache: "no-store" }).then((r) => r.json()).then((data) => {
  blogs = data.blogs || [];
  const read = blogs.filter((b) => b.status === "read");
  const mins = read.reduce((s, b) => s + (b.reading_minutes || 0), 0);
  const companies = new Set(blogs.map((b) => b.company)), sources = new Set(blogs.map((b) => b.source));
  $("#stats").innerHTML = `<b>${blogs.length}</b> posts · <b>${read.length}</b> read · <b>${companies.size}</b> companies · ` +
    `<b>${sources.size}</b> sources · ~<b>${Math.floor(mins / 60)}h ${mins % 60}m</b> of reading` +
    (data.repo ? ` · <a href="https://github.com/${esc(data.repo)}">repo</a>` : "");
  fillSelect("#company", blogs.map((b) => b.company));
  fillSelect("#source", blogs.map((b) => b.source));
  const g = recall("group");
  if (g) document.querySelector(`.seg button[data-g="${g}"]`)?.click(); else render();
}).catch(() => { $("#stats").textContent = "Couldn't load data/blogs.json"; });
</script>
</body>
</html>
